<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Love Letter For my Babyy 💗</title>


    <style>

        body {

            margin: 0;

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #27001d;

            font-family: "Courier New", monospace;

        }


        .window {

            width: 350px;

            background: #ffdce8;

            border: 4px solid #d66b91;

            border-radius: 10px;

            overflow: hidden;

            box-shadow:
                0 15px 40px rgba(176, 0, 108, 0.936);

        }


        .titlebar {

            height: 45px;

            background: #e99ab5;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 12px;

            color: white;

            font-weight: bold;

        }


        .dots {

            display: flex;

            gap: 6px;

        }


        .dot {

            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: white;

        }


        .content {

            padding: 25px;

            text-align: center;

            background-color: #ffd7e4;

        }


        h1 {

            font-size: 21px;

            color: #74233f;

            line-height: 1.5;

        }


        .cat {

            font-size: 80px;

            margin: 15px;

        }


        .question {

            font-size: 18px;

            color: #8b294c;

            margin-bottom: 20px;

        }


        .buttons {

            display: flex;

            justify-content: center;

            gap: 15px;

        }


        button {

            font-family: "Courier New", monospace;

            font-weight: bold;

            padding: 10px 25px;

            border: 2px solid #e6608d;

            background: #fff4f7;

            color: #8b294c;

            cursor: pointer;

        }


        button:hover {

            background: #ffb9ce;

        }

        .heart {

            position: fixed;

            color: #ff6f9f;

            font-size: 25px;

            animation: float 5s linear;

        }


        @keyframes float {

          0% {

            transform: translateY(100vh);

            opacity: 0;

        }


        20% {

           opacity: 1;

        }


        100% {

           transform: translateY(-10vh);

           opacity: 0;

        }

    }

    </style>

</head>


<body>


    <div class="window">


        <div class="titlebar">

            <span>WIFEYY💗</span>


            <div class="dots">

                <div class="dot"></div>

                <div class="dot"></div>

                <div class="dot"></div>

            </div>

        </div>


        <div class="content">


        <h1>
          Happy 1st Monthsary,<br>
          Baby koo♡
        </h1>    


            <div class="cat">

                🐈‍⬛💗

            </div>


        <div class="question">
          Will you stay with me? 🥺
        </div>


            <div class="buttons">

            <button id="yes">YES</button>

            <button id="no">NO</button>    

            </div>


        </div>


    </div>

    <script>

    const yes =
        document.getElementById("yes");

    const no =
        document.getElementById("no");


    yes.addEventListener("click", function() {

        alert("YAYYY! I LOVE YOU SO MUCHHY POO BABYY KOO! 💗🥺");

    });


    no.addEventListener("mouseover", function() {

        const x =
            Math.random() * 200 - 100;

        const y =
            Math.random() * 100 - 50;


        no.style.transform =
            `translate(${x}px, ${y}px)`;

    });  

    function createHeart() {

         const heart =
            document.createElement("div");

        heart.className = "heart";

        heart.innerHTML = "💖";

        heart.style.left =
            Math.random() * 200 + "vw";

    document.body.appendChild(heart);


    setTimeout(function() {

        heart.remove();

    }, 5000);

}


setInterval(createHeart, 700);

    </script>



</body>

</html>
